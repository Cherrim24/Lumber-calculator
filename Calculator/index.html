<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор сруба — построение плана</title>
<style>
:root{--line:#dfe5ee;--txt:#2b3445;--acc:#2f6fed;--bg:#f4f7fb}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:var(--txt);height:100vh;overflow:hidden;background:var(--bg)}
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
#toolbar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap;z-index:5}
#toolbar button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--txt)}
#toolbar button:hover{border-color:#c3cee0;background:#f6f9ff}
#toolbar button.active{background:var(--acc);color:#fff;border-color:var(--acc)}
.toolsep{width:1px;height:24px;background:var(--line);margin:0 4px}
#mats{display:inline-flex;gap:4px}
.swatch{width:20px;height:20px;border-radius:5px;border:2px solid transparent;cursor:pointer;display:inline-block}
.swatch.active{outline:2px solid var(--acc);outline-offset:1px}
#toolbar label{display:inline-flex;align-items:center;gap:5px;font-size:13px}
#floor-height{width:52px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;font:inherit}
#main{flex:1;display:flex;min-height:0}
#left2d{flex:0 0 46%;position:relative;background:radial-gradient(#fff,#f1f4f9);border-right:1px solid var(--line);min-width:280px}
#left-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#resize{width:6px;flex:0 0 6px;cursor:col-resize;background:#fff;border-right:1px solid var(--line)}
#resize:hover{background:#d7e0ee}
#right3d{flex:1;position:relative;background:#dfe6f0;min-width:180px}
#three-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#floor-tabs{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:3}
#floor-tabs button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 9px;cursor:pointer;font-size:12px}
#floor-tabs button.active{background:var(--acc);color:#fff;border-color:var(--acc)}
#hint{position:absolute;top:10px;right:10px;font-size:11px;color:#667;background:#fff;border:1px solid var(--line);border-radius:7px;padding:4px 9px;max-width:230px;z-index:3}
#plan-status{position:absolute;bottom:10px;left:10px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:#445;z-index:3}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#232a33;color:#fff;border-radius:9px;padding:9px 16px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:90;font-size:13px}
#toast.show{opacity:1}
#roof-page{position:absolute;inset:0;background:#fff;padding:24px;overflow:auto;z-index:5}
#roof-page.hidden{display:none}
#roof-page h3{margin:0 0 6px;font-size:17px}
.roof-page-note{font-size:12px;color:#667;margin:0 0 14px}
.roof-tabs{display:flex;gap:6px;margin-bottom:16px}
.roof-tabs button{flex:1;font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px;cursor:pointer}
.roof-tabs button.active{background:var(--acc);color:#fff;border-color:var(--acc)}
#roof-types{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.roof-type{border:1px solid var(--line);border-radius:9px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-size:12px;color:var(--txt)}
.roof-type svg{width:34px;height:26px;color:#5a6b85}
.roof-type.active{border-color:var(--acc);background:#f2f6ff;color:var(--acc)}
.roof-panel label{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px}
.roof-panel input[type=range]{flex:1}
.roof-val{min-width:44px;text-align:right;color:#445}
.roof-done{width:100%;font:inherit;background:var(--acc);color:#fff;border:none;border-radius:9px;padding:10px;cursor:pointer;margin-top:12px}
.roof-done:hover{background:#2562d0}
.confirm{position:fixed;inset:0;background:rgba(20,26,38,.35);display:flex;align-items:center;justify-content:center;z-index:95}
.confirm.hidden{display:none}
.confirm-box{background:#fff;border-radius:12px;padding:20px 24px;width:300px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.confirm-box p{margin:0 0 16px;font-size:14px}
.confirm-btns{display:flex;gap:8px;justify-content:flex-end}
.confirm-btns button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 18px;cursor:pointer}
.confirm-btns button.primary{background:#e6452f;color:#fff;border-color:#e6452f}
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <button id="tool-draw" title="Наружные стены">Стена</button>
    <button id="tool-part" title="Внутренние перегородки">Внутр. стена</button>
    <button id="tool-delete" title="Удалить стену">Удалить</button>
    <button id="tool-select" title="Выделить, передвинуть или удалить стену">Выделить</button>
    <button id="tool-door" title="Дверной проём">Дверь</button>
    <button id="tool-window" title="Оконный проём">Окно</button>
    <span class="toolsep"></span>
    <button id="btn-floor" title="Добавить этаж">+ Этаж</button>
    <label>Высота <input id="floor-height" type="number" min="2" max="4" step="0.1" value="2.5"/><span>м</span></label>
    <button id="btn-roof" title="Выбрать крышу">Крыша</button>
    <span class="toolsep"></span>
    <span id="mats"></span>
  </div>
  <div id="main">
    <div id="left2d">
      <canvas id="left-canvas"></canvas>
      <div id="floor-tabs"></div>
      <div id="hint"></div>
      <div id="plan-status"></div>
      <div id="roof-page" class="hidden">
        <h3>Крыша</h3>
        <p class="roof-page-note">Основная крыша строится по самому большому контуру, крыша пристройки — по остальным контурам, примыкающим к зданию.</p>
        <div class="roof-tabs">
          <button data-tab="main" class="active">Основная крыша</button>
          <button data-tab="annex">Крыша пристройки</button>
        </div>
        <div id="roof-types"></div>
        <div class="roof-panel">
          <label>Уклон <input id="roof-slope" type="range" min="5" max="60" step="1" value="30"/><span class="roof-val" id="roof-slope-v">30°</span></label>
          <label>Свес <input id="roof-over" type="range" min="0" max="1.5" step="0.1" value="0.4"/><span class="roof-val" id="roof-over-v">0.4 м</span></label>
          <button class="roof-done" id="roof-done">Готово</button>
        </div>
      </div>
    </div>
    <div id="resize"></div>
    <div id="right3d"><canvas id="three-canvas"></canvas></div>
  </div>
</div>

<div id="toast"></div>
<div id="confirm" class="confirm hidden">
  <div class="confirm-box">
    <p id="confirm-msg"></p>
    <div class="confirm-btns">
      <button id="confirm-yes" class="primary">Да</button>
      <button id="confirm-no">Нет</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
"use strict";
const PROJ={
  tool:'draw', grid:0.25, snapR:0.5, thickness:0.16,
  selFloor:0, mat:'#c9b38a', matRoof:'#8a5a3b',
  roof:{ type:'gable', slope:30, over:0.4 }, roofAnnex:{ type:'shed', slope:25, over:0.3 }, showRoof:false,
  floors:[{ walls:[], yBase:0, height:2.5 }]
};
const MATS=['#c9b38a','#8d5b2b','#b0a58f','#5b6b7a','#a9b7c6','#d9c9a3','#7a5c3e','#e8e4da'];
const rd=x=>Math.round(x*10)/10;
let idSeq=1;

const cv2=document.getElementById('left-canvas'), ctx2=cv2.getContext('2d');
const FLO_TABS=document.getElementById('floor-tabs');
const VIEW_W=30, VIEW_H=20;
let cam={ x:6, z:2, zf:1 };
let hover=null, panning=null, curPt=[0,0];

const floorCur = ()=>PROJ.floors[PROJ.selFloor];
const curWalls = ()=>floorCur().walls;
const newFloor=(yBase,height)=>({ walls:[], yBase, height });

/* ============================================================
   Toolbar
============================================================ */
function setTool(t){ PROJ.tool=t;
  poly=null; pe=null; sel.clear(); dragStart=null; marquee=null;
  const m={ draw:'tool-draw', partition:'tool-part', delete:'tool-delete', select:'tool-select', door:'tool-door', window:'tool-window' };
  for(const k in m) document.getElementById(m[k]).classList.toggle('active', k===t);
  document.getElementById('hint').textContent=
    (t==='draw')?'Клик = точка · угол автоматически по кругу 15° · Shift = свободный угол · точки цепляются к стенам · клик у 1-й точки замыкает контур, ПКМ = отмена шага':
    (t==='partition')?'Клик на стене = начало · тяните к другой стене · клик = создать · ПКМ или Esc = отмена':
    t==='delete'?'Кликните по стене, чтобы удалить':
    t==='select'?'Клик = выделить · Ctrl+клик = добавить · тяните по пустому = рамка выделения · тяните выделенную стену = переместить все вместе · ПКМ = удалить (с подтверждением) · Del = удалить сразу · Esc/клик по пустому = снять выделение':
    t==='door'?'Кликните по стене, чтобы поставить дверь':
    t==='window'?'Кликните по стене, чтобы поставить окно':'';
}
let toastT;
function toast(m){ const e=document.getElementById('toast'); e.textContent=m; e.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>e.classList.remove('show'),1400); }
let confirmCb=null;
function askConfirm(msg,onYes){
  const c=document.getElementById('confirm');
  document.getElementById('confirm-msg').textContent=msg;
  confirmCb=onYes;
  document.getElementById('confirm-yes').onclick=()=>{ closeConfirm(true); };
  document.getElementById('confirm-no').onclick=()=>{ closeConfirm(false); };
  c.classList.remove('hidden');
}
function closeConfirm(yes){ const c=document.getElementById('confirm');
  c.classList.add('hidden');
  const cb=confirmCb; confirmCb=null;
  if(yes&&cb) cb();
}
function segInRect(w,minX,maxX,minZ,maxZ){
  const ax=w.x1,az=w.z1,bx=w.x2,bz=w.z2,dx=bx-ax,dz=bz-az;
  let t0=0,t1=1;
  const clip=(p,q)=>{ if(p===0) return q>=0; const r=q/p;
    if(p<0){ if(r>t1) return false; if(r>t0) t0=r; }
    else { if(r<t0) return false; if(r<t1) t1=r; } return true; };
  return clip(-dx,ax-minX)&&clip(dx,maxX-ax)&&clip(-dz,az-minZ)&&clip(dz,maxZ-az);
}

document.getElementById('tool-draw').onclick=()=>setTool('draw');
document.getElementById('tool-part').onclick=()=>setTool('partition');
document.getElementById('tool-delete').onclick=()=>setTool('delete');
document.getElementById('tool-select').onclick=()=>setTool('select');
document.getElementById('tool-door').onclick=()=>setTool('door');
document.getElementById('tool-window').onclick=()=>setTool('window');
document.getElementById('btn-floor').onclick=()=>{
  poly=null; pe=null;
  const last=PROJ.floors[PROJ.floors.length-1];
  PROJ.floors.push(newFloor(last.yBase+last.height, 2.5));
  PROJ.selFloor=PROJ.floors.length-1;
  refreshTabs(); refresh(); toast('Добавлен этаж '+(PROJ.selFloor+1));
};
document.getElementById('floor-height').oninput=e=>{ floorCur().height=parseFloat(e.target.value)||2.5; refresh(); refreshHeightInput(); };

/* ---------- крыша ---------- */
const ROOF_TYPES = [
  { id:'gable', name:'Двускатная', icon:'M2 20 L23 20 L12.5 4 Z' },
  { id:'hip',   name:'Вальмовая',  icon:'M2 20 L6 12 L18 12 L22 20 Z M12 4 L18 12 L6 12 Z' },
  { id:'shed',  name:'Односкатная',icon:'M2 20 L22 20 L22 7 L2 12 Z' },
  { id:'flat',  name:'Плоская',    icon:'M2 14 L22 14 L22 20 L2 20 Z M22 14 L14 8 L8 8 L2 14 Z' }
];
let roofTab='main'; // 'main' | 'annex'
const roofCfg = ()=>roofTab==='annex'?PROJ.roofAnnex:PROJ.roof;
function roofOverlayHTML(){
  const types=ROOF_TYPES.map(t=>`<div class="roof-type" data-id="${t.id}"><svg viewBox="0 0 24 24"><path d="${t.icon}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>${t.name}</div>`).join('');
  const el=document.getElementById('roof-types'); el.innerHTML=types;
  [...el.children].forEach(b=>b.onclick=()=>{ roofCfg().type=b.dataset.id; setRoofType(); refresh(); });
}
function setRoofType(){ const el=document.getElementById('roof-types');
  [...el.children].forEach(b=>b.classList.toggle('active', b.dataset.id===roofCfg().type)); }
function roofFill(){
  const c=roofCfg();
  document.getElementById('roof-slope').value=c.slope;
  document.getElementById('roof-slope-v').textContent=c.slope+'°';
  document.getElementById('roof-over').value=c.over;
  document.getElementById('roof-over-v').textContent=(+c.over).toFixed(1)+' м';
}
document.getElementById('btn-roof').onclick=()=>{ openRoof(true); };
document.getElementById('roof-done').onclick=()=>openRoof(false);
document.querySelectorAll('.roof-tabs button').forEach(b=>b.onclick=()=>{
  roofTab=b.dataset.tab;
  [...document.querySelectorAll('.roof-tabs button')].forEach(x=>x.classList.toggle('active', x===b));
  roofFill(); roofOverlayHTML(); setRoofType(); refresh();
});
document.getElementById('roof-slope').oninput=e=>{ roofCfg().slope=parseFloat(e.target.value); document.getElementById('roof-slope-v').textContent=roofCfg().slope+'°'; refresh(); };
document.getElementById('roof-over').oninput=e=>{ roofCfg().over=parseFloat(e.target.value); document.getElementById('roof-over-v').textContent=(+roofCfg().over).toFixed(1)+' м'; refresh(); };
function openRoof(on){
  const rp=document.getElementById('roof-page');
  // пока меню крыши открыто — эскиз полностью заменён меню
  uiBlock=on;
  cv2.style.pointerEvents = on?'none':'';
  if(on){
    PROJ.showRoof=true;
    document.getElementById('btn-roof').classList.add('active');
    roofFill(); roofOverlayHTML(); setRoofType();
    rp.classList.remove('hidden'); refresh();
  } else {
    rp.classList.add('hidden'); refresh(); toast('Крыша добавлена');
  }
}

const matsEl=document.getElementById('mats');
MATS.forEach(c=>{ const s=document.createElement('span');
  s.className='swatch'; s.style.background=c; s.title=c;
  s.onclick=()=>{ PROJ.mat=c; refreshMats(); refresh(); };
  matsEl.appendChild(s); });
function refreshMats(){ [...matsEl.children].forEach(s=>s.classList.toggle('active', s.style.background===PROJ.mat)); }

function refreshTabs(){
  FLO_TABS.innerHTML='';
  PROJ.floors.forEach((f,i)=>{ const b=document.createElement('button');
    b.textContent='Этаж '+(i+1);
    b.classList.toggle('active', i===PROJ.selFloor);
    b.onclick=()=>{ poly=null; pe=null; PROJ.selFloor=i; refreshTabs(); refreshHeightInput(); refresh(); };
    FLO_TABS.appendChild(b); });
}
function refreshHeightInput(){ document.getElementById('floor-height').value=rd(floorCur().height); }

/* ============================================================
   2D
============================================================ */
function size2(){ const r=document.getElementById('left2d').getBoundingClientRect();
  if(r.width>0){ cv2.width=r.width; cv2.height=r.height; } }
function S(){ return cam.zf*Math.min(cv2.width/VIEW_W, cv2.height/VIEW_H); }
function w2s(wx,wz){ const s=S(); return [(wx-cam.x)*s+cv2.width/2, cv2.height/2-(wz-cam.z)*s]; }
function s2w(sx,sy){ const s=S(); return [cam.x+(sx-cv2.width/2)/s, cam.z+(cv2.height/2-sy)/s]; }

function drawGrid(){
  ctx2.clearRect(0,0,cv2.width,cv2.height);
  const s=S();
  ctx2.strokeStyle='#e2e8f1'; ctx2.lineWidth=1; ctx2.beginPath();
  const x0=Math.floor(cam.x-cv2.width/2/s),x1=Math.ceil(cam.x+cv2.width/2/s);
  for(let x=x0;x<=x1;x++){ const p=(x-cam.x)*s+cv2.width/2; ctx2.moveTo(p,0); ctx2.lineTo(p,cv2.height); }
  const z0=Math.floor(cam.z-cv2.height/2/s),z1=Math.ceil(cam.z+cv2.height/2/s);
  for(let z=z0;z<=z1;z++){ const p=cv2.height/2-(z-cam.z)*s; ctx2.moveTo(0,p); ctx2.lineTo(cv2.width,p); }
  ctx2.stroke();
  const a=w2s(0,0); ctx2.fillStyle='#b9c2d1'; ctx2.fillRect(a[0]-2,a[1]-2,4,4);
}
function snapPoint(ax,az){
  const gx=Math.round(ax/PROJ.grid)*PROJ.grid, gz=Math.round(az/PROJ.grid)*PROJ.grid;
  let best={ x:gx,z:gz,d:Math.hypot(ax-gx,az-gz) };
  for(const w of curWalls()){
    for(const p of [[w.x1,w.z1],[w.x2,w.z2]]){
      const d=Math.hypot(p[0]-ax,p[1]-az);
      if(d<best.d && d<PROJ.snapR) best={x:p[0],z:p[1],d};
    }
    const dx=w.x2-w.x1,dz=w.z2-w.z1,L2=dx*dx+dz*dz;
    if(L2>0){ let t=((ax-w.x1)*dx+(az-w.z1)*dz)/L2; t=t<0?0:t>1?1:t;
      const px=w.x1+dx*t,pz=w.z1+dz*t,d=Math.hypot(px-ax,pz-az);
      if(d<best.d && d<PROJ.snapR) best={x:px,z:pz,d}; }
  }
  return {x:best.x,z:best.z};
}
function hitWall(x,z){
  const tol=0.22;
  for(const w of curWalls()){
    const dx=w.x2-w.x1,dz=w.z2-w.z1,L2=dx*dx+dz*dz; if(L2<=0)continue;
    let t=((x-w.x1)*dx+(z-w.z1)*dz)/L2; t=t<0?0:t>1?1:t;
    const px=w.x1+dx*t,pz=w.z1+dz*t;
    if(Math.hypot(px-x,pz-z)<=tol) return w;
  }
  return null;
}
const wallLen = w=>Math.hypot(w.x2-w.x1,w.z2-w.z1);

function addWall(w){ const f=floorCur(); w.id=idSeq++; f.walls.push(w); }
function distAlong(w,mx,mz){ const L=wallLen(w); if(L<=0)return 0;
  return ((mx-w.x1)*(w.x2-w.x1)+(mz-w.z1)*(w.z2-w.z1))/L; }

/* ------ события 2D ------ */
let poly=null;      // одна стена: { start, first, anchor, pts:[{x,z}] } — жест «точка → тянуть → точка»
let pe=null;        // предпросмотр конца сегмента
let uiBlock=false;  // эскиз неактивен (напр. открыто меню крыши)
let sel=new Set();  // выделенные стены (как выделение файлов): можно несколько
let dragStart=null; // при перетаскивании: {sx,sy,sw:[wx,wz],items:[{w,x1,z1,x2,z2}]}
let marquee=null;   // рамка выделения (мировые координаты): {x0,z0,x1,z1}

// ВНУТРЕННЯЯ стена — один жест: клик на стене (кружок) → точка начала → тянуть к другой стене → клик = создать → стоп.
function commitWall(e){
  const rect=cv2.getBoundingClientRect();
  const c=s2w(e.clientX-rect.left,e.clientY-rect.top);
  if(!poly){
    const s=shapeSnap(c[0],c[1]);
    if(!s){ draw2(); return; }
    const start={x:s.x,z:s.z};
    poly={ start, first:{x:start.x,z:start.z}, anchor:{x:start.x,z:start.z}, pts:[{x:start.x,z:start.z}], walls:[] };
    toast('Тяните к другой стене и кликните');
    draw2(); return;
  }
  const end=snapEnd(c[0],c[1], e.shiftKey);
  const len=Math.hypot(end.x-poly.start.x, end.z-poly.start.z);
  if(len>=0.18){ addWall({x1:poly.start.x,z1:poly.start.z,x2:end.x,z2:end.z,type:segType(),gaps:[]}); toast('Внутренняя стена создана'); }
  poly=null; pe=null;
  refresh();
}

// НАРУЖНАЯ стена — непрерывная цепочка: клик = поставить точку и продолжить; клик у 1-й точки замыкает контур.
function commitVertex(e){
  const rect=cv2.getBoundingClientRect();
  const c=s2w(e.clientX-rect.left,e.clientY-rect.top);
  const end=snapEnd(c[0],c[1], e.shiftKey);
  if(!poly){
    poly={ first:{x:end.x,z:end.z}, anchor:{x:end.x,z:end.z}, pts:[{x:end.x,z:end.z}], walls:[] };
    toast('Поставьте следующую точку · клик у первой точки замкнёт контур');
    draw2(); return;
  }
  if(end.closing && poly.pts.length>=2){
    const a=poly.anchor;
    const w={x1:a.x,z1:a.z,x2:poly.first.x,z2:poly.first.z,type:segType(),gaps:[]};
    addWall(w); poly.walls.push(w);
    poly=null; pe=null;
    toast('Контур замкнут');
    refresh(); return;
  }
  const len=Math.hypot(end.x-poly.anchor.x, end.z-poly.anchor.z);
  if(len<0.18){ draw2(); return; }
  const a=poly.anchor;
  const w={x1:a.x,z1:a.z,x2:end.x,z2:end.z,type:segType(),gaps:[]};
  addWall(w); poly.walls.push(w);
  poly.anchor={x:end.x,z:end.z};
  poly.pts.push({x:end.x,z:end.z});
  refresh();
}

function undoVertex(){
  if(!poly){ return; }
  if(poly.walls.length){
    const w=poly.walls.pop();
    const i=curWalls().indexOf(w); if(i>=0) curWalls().splice(i,1);
    poly.pts.pop();
    poly.anchor={ x:poly.pts[poly.pts.length-1].x, z:poly.pts[poly.pts.length-1].z };
    toast('Шаг отменён');
  } else { poly=null; pe=null; }
  refresh();
}

function segType(){ return PROJ.tool==='partition'?'partition':'wall'; }

/* ---------- снап к геометрии ---------- */
function wallPoints(){ const a=[]; for(const w of curWalls()){ a.push([w.x1,w.z1],[w.x2,w.z2]); } return a; }
function projOn(w,mx,mz){
  const dx=w.x2-w.x1,dz=w.z2-w.z1,L2=dx*dx+dz*dz; if(L2<=0)return null;
  let t=((mx-w.x1)*dx+(mz-w.z1)*dz)/L2; t=t<0?0:t>1?1:t;
  const x=w.x1+dx*t,z=w.z1+dz*t,d=Math.hypot(x-mx,z-mz);
  return d<=0.5?{x,z,d}:null;
}
/* привязка к ближайшей вершине стены или к самой стене (наклонно/перпендикулярно) */
function shapeSnap(mx,mz){
  let best=null;
  for(const [vx,vz] of wallPoints()){
    const d=Math.hypot(vx-mx,vz-mz);
    if(d<0.5 && (!best||d<best.d)) best={x:vx,z:vz,d,kind:'vertex'};
  }
  for(const w of curWalls()){
    const p=projOn(w,mx,mz);
    if(p && (!best||p.d<best.d)) best={x:p.x,z:p.z,d:p.d,kind:'wall'};
  }
  return best;
}

// вызов опорной системы осей: направления стен, сгуппированные по углу (mod 180°).
// Это позволяет снапать корректно и когда дом повёрнут «под углом».
function snapFrames(){
  const cl=[];
  for(const w of curWalls()){
    const L=wallLen(w); if(L<1e-6) continue;
    let a=Math.atan2(w.z2-w.z1, w.x2-w.x1)*180/Math.PI;
    while(a<0)a+=180; while(a>=180)a-=180;
    let hit=false;
    for(const c of cl){
      const d=Math.abs(((a-c.a)+180)%360-180);
      if(d<=4){ c.a=(c.a*c.n+a)/(c.n+1); c.n++; hit=true; break; }
    }
    if(!hit) cl.push({a,n:1});
  }
  return cl.map(c=>{ const th=c.a*Math.PI/180;
    const u={x:Math.cos(th),z:Math.sin(th)}, p={x:-Math.sin(th),z:Math.cos(th)};
    return {u,p,a:c.a}; });
}
const toCoords=(u,p,x,z)=>({u:x*u.x+z*u.z, p:x*p.x+z*p.z});
const fromCoords=(u,p,U,P)=>({x:U*u.x+P*p.x, z:U*u.z+P*p.z});

// фиксирование курсора относительно ПАРАЛЛЕЛЬНОЙ точки V (общая координата вдоль u или p).
// Работает на любом (в т.ч. диагональном) направлении дома.
function alignSnap(mx,mz){
  const pts=wallPoints(); if(!pts.length) return null;
  const T=0.25; let best=null;
  for(const fr of snapFrames()){
    const {u,p}=fr, C=toCoords(u,p,mx,mz);
    for(const [vx,vz] of pts){
      const V=toCoords(u,p,vx,vz);
      const c1=fromCoords(u,p,V.u,C.p), d1=Math.hypot(c1.x-mx,c1.z-mz);
      if(d1<=T && (!best||d1<best.d)) best={x:c1.x,z:c1.z,d:d1,ref:{x:vx,z:vz},axis:'u',u,p};
      const c2=fromCoords(u,p,C.u,V.p), d2=Math.hypot(c2.x-mx,c2.z-mz);
      if(d2<=T && (!best||d2<best.d)) best={x:c2.x,z:c2.z,d:d2,ref:{x:vx,z:vz},axis:'p',u,p};
    }
  }
  return best;
}

// позиционирование ОТНОСИТЕЛЬНО ДВУХ ТОЧЕК (якорь A + опорная вершина V):
// точка = пересечение стены из A (параллельно u или перпендикулярно) с линией через V
// (параллельно другой оси). Работает и для диагонального дома.
function cornerSnap(mx,mz){
  if(!poly) return null;
  const A=poly.anchor, R=0.55, pts=wallPoints(); let best=null;
  for(const fr of snapFrames()){
    const {u,p}=fr, Ap=toCoords(u,p,A.x,A.z);
    for(const [vx,vz] of pts){
      const Vp=toCoords(u,p,vx,vz);
      // c1: стена ∥ u из A, конец на линии через V ∥ p → (u=V.u, p=A.p)
      const c1=fromCoords(u,p,Vp.u,Ap.p), d1=Math.hypot(c1.x-mx,c1.z-mz);
      if(d1<=R && (!best||d1<best.d)) best={x:c1.x,z:c1.z,d:d1,ref:{x:vx,z:vz},kind:'corner',axis:'u',u,p};
      // c2: стена ∥ p из A, конец на линии через V ∥ u → (u=A.u, p=V.p)
      const c2=fromCoords(u,p,Ap.u,Vp.p), d2=Math.hypot(c2.x-mx,c2.z-mz);
      if(d2<=R && (!best||d2<best.d)) best={x:c2.x,z:c2.z,d:d2,ref:{x:vx,z:vz},kind:'corner',axis:'p',u,p};
    }
  }
  return best;
}

// ПОЛНЫЙ «круг градусов» с шагом 15° (все 360°), привязанный к оси дома.
// Работает всегда; free=true (Shift) — отключает привязку для произвольного угла.
function angleSnapEnd(ax, az, wx, wz, free){
  const dx=wx-ax, dz=wz-az, len=Math.hypot(dx,dz);
  if(len<=0.001) return { x:ax, z:az, angDeg:0 };
  let ang0=Math.atan2(dz,dx); ang0=((ang0%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
  if(free) return { x:wx, z:wz, angDeg:(ang0*180/Math.PI) };
  const step=15*Math.PI/180, frs=snapFrames();
  let bestA=null, bestD=1e9;
  const add=a=>{ a=((a%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
    const dd=Math.min(Math.abs(ang0-a), 2*Math.PI-Math.abs(ang0-a));
    if(dd<bestD){ bestD=dd; bestA=a; } };
  if(frs.length){ for(const f of frs){ const f0=f.a*Math.PI/180; for(let k=0;k<24;k++) add(f0+k*step); } }
  else{ for(let k=0;k<24;k++) add(k*step); }
  return { x:ax+Math.cos(bestA)*len, z:az+Math.sin(bestA)*len, angDeg:((bestA*180/Math.PI)%360+360)%360 };
}

/* конец сегмента: вершина/стена/пересечение/выравнивание, затем угол шага 15° (полный круг).
   Shift — временно отключить привязку угла и рисовать под произвольным углом. */
function snapEnd(wx,wz,shift){
  // начало цепочки — без якоря
  if(!poly){
    const s=shapeSnap(wx,wz);
    if(s) return { x:s.x, z:s.z, closing:false, type:s.kind, ref:s };
    const a=alignSnap(wx,wz);
    if(a) return { x:a.x, z:a.z, closing:false, type:'align', axis:a.axis, ref:a.ref };
    const g=snapPoint(wx,wz);
    return { x:g.x, z:g.z, closing:false, type:'grid' };
  }
  // замыкание на первую точку
  if(poly.pts.length>=2 && Math.hypot(poly.first.x-wx, poly.first.z-wz)<PROJ.snapR)
    return { x:poly.first.x, z:poly.first.z, closing:true, type:'closing' };

  const s=shapeSnap(wx,wz);
  if(s) return { x:s.x, z:s.z, closing:false, type:s.kind, ref:s };
  const c=cornerSnap(wx,wz);
  if(c) return { x:c.x, z:c.z, closing:false, type:'corner', ref:c.ref, u:c.u, p:c.p };
  const a=alignSnap(wx,wz);
  if(a) return { x:a.x, z:a.z, closing:false, type:'align', axis:a.axis, ref:a.ref, u:a.u, p:a.p };
  // свободное рисование: фиксируем длину, угол — на полный круг 15° (без Shift)
  const e=angleSnapEnd(poly.anchor.x, poly.anchor.z, wx, wz, !!shift);
  return { x:e.x, z:e.z, closing:false, type:'angle', angDeg:e.angDeg };
}

window.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    if(poly){ poly=null; pe=null; toast('Стена отменена'); draw2(); }
    else if(sel.size){ sel.clear(); draw2(); }

  if(e.key==='Delete'&&sel.size){ const n=sel.size; for(const w of sel){ const i=curWalls().indexOf(w); if(i>=0) curWalls().splice(i,1); } sel.clear(); toast('Удалено стен: '+n); refresh(); }
});

function addShape(w){
  const L=wallLen(w);
  const seg=Math.max(0.4, Math.min(L-0.4, distAlong(w,curPt[0],curPt[1])));
  w.gaps=w.gaps||[];
  const pos=Math.max(0.55, Math.min(L-0.55, seg));
  w.gaps.push({ type:PROJ.tool, pos:pos });
  toast(PROJ.tool==='door'?'Дверь добавлена':'Окно добавлено');
}

function refresh(){ draw2(); refreshStatus(); rebuild3(); }
function refreshStatus(){ const n=curWalls().length;
  let l='';
  if(poly&&pe){
    const L=Math.hypot(pe.x-poly.anchor.x, pe.z-poly.anchor.z);
    let aDeg=Math.round(Math.atan2(pe.z-poly.anchor.z, pe.x-poly.anchor.x)*180/Math.PI);
    aDeg=((aDeg%360)+360)%360;
    l=' · длина: '+rd(L)+' м · угол: '+aDeg+'°';
  }
  document.getElementById('plan-status').textContent='Этаж '+(PROJ.selFloor+1)+' · стен: '+n+l; }

// метка длины сегмента в метрах (у середины, со смещением перпендикулярно стене)
function drawLenLabel(x1,z1,x2,z2,color){
  const L=Math.hypot(x2-x1,z2-z1); if(L<0.35) return;
  const mx=(x1+x2)/2, mz=(z1+z2)/2;
  const dx=x2-x1,dz=z2-z1, l=L||1, off=13/S();
  const p=w2s(mx-dz/l*off, mz+dx/l*off);
  const t=rd(L).toFixed(1)+' м';
  ctx2.font='bold 11px -apple-system,"Segoe UI",sans-serif';
  ctx2.textAlign='center'; ctx2.textBaseline='middle';
  ctx2.lineWidth=3; ctx2.strokeStyle='rgba(255,255,255,.85)';
  ctx2.strokeText(t,p[0],p[1]);
  ctx2.fillStyle=color; ctx2.fillText(t,p[0],p[1]);
}

function draw2(){
  size2(); drawGrid();
  const f=floorCur(); if(!f) return;
  ctx2.lineCap='round';
  for(const w of f.walls){
    const a=w2s(w.x1,w.z1), b=w2s(w.x2,w.z2);
    ctx2.strokeStyle=w.type==='partition'?'#7a8fae':'#33445c';
    ctx2.lineWidth=6;
    ctx2.beginPath(); ctx2.moveTo(a[0],a[1]); ctx2.lineTo(b[0],b[1]); ctx2.stroke();
    if(w.gaps) for(const g of w.gaps){
      const ax=(g.type==='door'?0.45:0.6), ux=(w.x2-w.x1)/wallLen(w), uz=(w.z2-w.z1)/wallLen(w);
      const [p1]=w2s(w.x1+ux*(g.pos-ax), w.z1+uz*(g.pos-ax));
      const [p2]=w2s(w.x1+ux*(g.pos+ax), w.z1+uz*(g.pos+ax));
      ctx2.strokeStyle='#e14d2a'; ctx2.lineWidth=3; ctx2.setLineDash([4,3]);
      ctx2.beginPath(); ctx2.moveTo(p1[0],p1[1]); ctx2.lineTo(p2[0],p2[1]); ctx2.stroke(); ctx2.setLineDash([]);
    }
    drawLenLabel(w.x1,w.z1,w.x2,w.z2, w.type==='partition'?'#5a6f8c':'#33445c');
  }
  // цепочка рисования: поставленные точки + живой сегмент
  if(poly){
    ctx2.fillStyle='#2f6fed';
    for(const p of poly.pts){ const a=w2s(p.x,p.z);
      ctx2.beginPath(); ctx2.arc(a[0],a[1],3.5,0,7); ctx2.fill(); }
    if(pe){
      const a=w2s(poly.anchor.x,poly.anchor.z), b=w2s(pe.x,pe.z);
      ctx2.strokeStyle=pe.closing?'#e6452f':'#2f6fed';
      ctx2.lineWidth=2; ctx2.setLineDash([6,4]);
      ctx2.beginPath(); ctx2.moveTo(a[0],a[1]); ctx2.lineTo(b[0],b[1]); ctx2.stroke();
      ctx2.setLineDash([]);
      ctx2.fillStyle=pe.closing?'#e6452f':'#2f6fed';
      ctx2.beginPath(); ctx2.arc(b[0],b[1],4,0,7); ctx2.fill();
      // длина протягиваемой стены в метрах (на лету)
      if(!pe.closing) drawLenLabel(poly.anchor.x, poly.anchor.z, pe.x, pe.z, '#1f5fd0');
      // ---- подсказка: точное пересечение (две точки, прямой угол) ----
      if(pe.type==='corner' && pe.ref){
        const r=w2s(pe.ref.x,pe.ref.z);
        const u=pe.u||{x:1,z:0}, pn=pe.p||{x:0,z:-1}, HL=3;
        ctx2.strokeStyle='#0b5394'; ctx2.lineWidth=2;
        ctx2.beginPath(); ctx2.arc(r[0],r[1],7,0,7); ctx2.stroke();
        ctx2.fillStyle='rgba(11,83,148,.25)'; ctx2.beginPath(); ctx2.arc(r[0],r[1],4,0,7); ctx2.fill();
        ctx2.strokeStyle='rgba(11,83,148,.55)'; ctx2.lineWidth=1.5; ctx2.setLineDash([4,4]);
        let q=w2s(pe.x-u.x*HL,pe.z-u.z*HL); let q2=w2s(pe.x+u.x*HL,pe.z+u.z*HL);
        ctx2.beginPath(); ctx2.moveTo(q[0],q[1]); ctx2.lineTo(q2[0],q2[1]); ctx2.stroke();
        q=w2s(pe.x-pn.x*HL,pe.z-pn.z*HL); q2=w2s(pe.x+pn.x*HL,pe.z+pn.z*HL);
        ctx2.beginPath(); ctx2.moveTo(q[0],q[1]); ctx2.lineTo(q2[0],q2[1]); ctx2.stroke();
        ctx2.setLineDash([]);
        ctx2.save(); ctx2.translate(b[0],b[1]); ctx2.rotate(Math.atan2(-u.z,u.x)); ctx2.strokeRect(-5,-5,10,10); ctx2.restore();
        ctx2.fillStyle='#0b5394'; ctx2.beginPath(); ctx2.arc(b[0],b[1],2.6,0,7); ctx2.fill();
      } else if(pe.type==='align' && pe.ref){
        const r=w2s(pe.ref.x,pe.ref.z);
        ctx2.strokeStyle='rgba(11,83,148,.6)'; ctx2.lineWidth=1.5; ctx2.setLineDash([3,3]);
        ctx2.beginPath(); ctx2.moveTo(b[0],b[1]); ctx2.lineTo(r[0],r[1]); ctx2.stroke(); ctx2.setLineDash([]);
        ctx2.strokeStyle='#0b5394'; ctx2.lineWidth=2;
        ctx2.beginPath(); ctx2.arc(r[0],r[1],7,0,7); ctx2.stroke();
        ctx2.fillStyle='rgba(11,83,148,.25)'; ctx2.beginPath(); ctx2.arc(r[0],r[1],4,0,7); ctx2.fill();
        const d=(pe.axis==='p'?(pe.p||{x:0,z:-1}):(pe.u||{x:1,z:0})), AL=0.22;
        const px1=w2s(pe.x-d.x*AL,pe.z-d.z*AL), px2=w2s(pe.x+d.x*AL,pe.z+d.z*AL);
        ctx2.strokeStyle='#0b5394'; ctx2.lineWidth=4;
        ctx2.beginPath(); ctx2.moveTo(px1[0],px1[1]); ctx2.lineTo(px2[0],px2[1]); ctx2.stroke();
        ctx2.strokeStyle='#0b5394'; ctx2.lineWidth=2;
        ctx2.beginPath(); ctx2.arc(b[0],b[1],8,0,7); ctx2.stroke();
        ctx2.fillStyle='#0b5394';
        ctx2.beginPath(); ctx2.arc(b[0],b[1]-2.5,2.2,Math.PI,0); ctx2.fill();
        ctx2.fillRect(b[0]-3.4,b[1]-0.5,6.8,5);
        ctx2.fillStyle='#fff'; ctx2.fillRect(b[0]-0.7,b[1]+0.8,1.4,2.6);
      } else if(pe.type==='vertex'||pe.type==='wall'){
        ctx2.strokeStyle='rgba(47,111,237,.8)'; ctx2.lineWidth=1.5;
        ctx2.beginPath(); ctx2.arc(b[0],b[1],6,0,7); ctx2.stroke();
      }
    }
  }
  // кружок при наведении на стену / точку начала (единый жест для внешней и внутренней стены)
  if(!poly && pe && pe.type==='p0'){
    const b=w2s(pe.x,pe.z);
    ctx2.strokeStyle='rgba(47,111,237,.95)'; ctx2.lineWidth=2;
    ctx2.beginPath(); ctx2.arc(b[0],b[1],7,0,7); ctx2.stroke();
    ctx2.fillStyle='rgba(47,111,237,.2)'; ctx2.beginPath(); ctx2.arc(b[0],b[1],3.5,0,7); ctx2.fill();
  }
  if(hover&&(PROJ.tool==='delete'||PROJ.tool==='door'||PROJ.tool==='window')){
    const a=w2s(hover.x1,hover.z1), b=w2s(hover.x2,hover.z2);
    ctx2.strokeStyle='#e6452f'; ctx2.lineWidth=9; ctx2.globalAlpha=.4;
    ctx2.beginPath(); ctx2.moveTo(a[0],a[1]); ctx2.lineTo(b[0],b[1]); ctx2.stroke(); ctx2.globalAlpha=1;
  }
  // рамка выделения
  if(marquee){
    const minX=Math.min(marquee.x0,marquee.x1), maxX=Math.max(marquee.x0,marquee.x1);
    const minZ=Math.min(marquee.z0,marquee.z1), maxZ=Math.max(marquee.z0,marquee.z1);
    const p0=w2s(minX,minZ), p1=w2s(maxX,maxZ);
    ctx2.fillStyle='rgba(47,111,237,.12)'; ctx2.fillRect(p0[0],p1[1],p1[0]-p0[0],p0[1]-p1[1]);
    ctx2.strokeStyle='#2f6fed'; ctx2.lineWidth=1.5; ctx2.setLineDash([5,4]);
    ctx2.strokeRect(p0[0],p1[1],p1[0]-p0[0],p0[1]-p1[1]); ctx2.setLineDash([]);
  }
  // инструмент «Выделить»: подсветка при наведении и выделенной стены с ручками
  if(PROJ.tool==='select'){
    if(hover&&!sel.has(hover)){
      const a=w2s(hover.x1,hover.z1), b=w2s(hover.x2,hover.z2);
      ctx2.strokeStyle='#2f6fed'; ctx2.lineWidth=9; ctx2.globalAlpha=.25;
      ctx2.beginPath(); ctx2.moveTo(a[0],a[1]); ctx2.lineTo(b[0],b[1]); ctx2.stroke(); ctx2.globalAlpha=1;
    }
    for(const w of sel){
      const a=w2s(w.x1,w.z1), b=w2s(w.x2,w.z2);
      ctx2.strokeStyle='#2f6fed'; ctx2.lineWidth=12; ctx2.globalAlpha=.35;
      ctx2.beginPath(); ctx2.moveTo(a[0],a[1]); ctx2.lineTo(b[0],b[1]); ctx2.stroke(); ctx2.globalAlpha=1;
      ctx2.strokeStyle='#2f6fed'; ctx2.lineWidth=2; ctx2.fillStyle='#fff';
      for(const [x,y] of [[a[0],a[1]],[b[0],b[1]]]){
        ctx2.fillRect(x-4,y-4,8,8); ctx2.strokeRect(x-4,y-4,8,8);
      }
    }
  }
  refreshStatus();
}

/* ============================================================
   3D
============================================================ */
let renderer, scene, camera3, controls;
const g3=new THREE.Group();

function init3D(){
  const c3=document.getElementById('three-canvas');
  const r=document.getElementById('right3d').getBoundingClientRect();
  renderer=new THREE.WebGLRenderer({canvas:c3,antialias:true});
  renderer.setSize(r.width||300,r.height||300);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  scene=new THREE.Scene(); scene.background=new THREE.Color(0xe8edf4);
  camera3=new THREE.PerspectiveCamera(50, (r.width||1)/(r.height||1), 0.05, 400);
  camera3.position.set(14,12,16);
  scene.add(new THREE.AmbientLight(0xffffff,0.55));
  const sun=new THREE.DirectionalLight(0xffffff,0.85); sun.position.set(14,22,10);
  sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.left=-40; sun.shadow.camera.right=40; sun.shadow.camera.top=40; sun.shadow.camera.bottom=-40; sun.shadow.camera.far=120;
  scene.add(sun); scene.add(new THREE.HemisphereLight(0xbfd4ff,0x8a9690,0.35));
  controls=new THREE.OrbitControls(camera3, renderer.domElement);
  controls.enableDamping=true; controls.target.set(5,1.5,1.5);
  const gg=new THREE.GridHelper(80,80,0x99a3b5,0xc9d1de); gg.position.y=-0.02; scene.add(gg);
  scene.add(g3);
  resize3(); tick();
}
function tick(){ requestAnimationFrame(tick); if(controls)controls.update(); if(renderer)renderer.render(scene,camera3); }
function resize3(){ if(!renderer)return; const r=document.getElementById('right3d').getBoundingClientRect();
  renderer.setSize(r.width,r.height);
  if(camera3){ camera3.aspect=r.width/r.height; camera3.updateProjectionMatrix(); } }

let matWall,matPart,matRoof,matSlab;
function buildMats(){
  matWall=new THREE.MeshStandardMaterial({color:new THREE.Color(PROJ.mat),roughness:.92,metalness:.02});
  matPart=new THREE.MeshStandardMaterial({color:new THREE.Color('#9db2c9'),roughness:.8});
  matRoof=new THREE.MeshStandardMaterial({color:new THREE.Color(PROJ.matRoof),roughness:.6,metalness:.05,side:THREE.DoubleSide});
  matSlab=new THREE.MeshStandardMaterial({color:new THREE.Color('#b9a083'),roughness:.85});
}

function wallBoxes(w,base,height){
  const t=PROJ.thickness;
  const dx=w.x2-w.x1,dz=w.z2-w.z1,L=Math.hypot(dx,dz); if(L<=0)return[];
  const ux=dx/L,uz=dz/L;
  let solid=[[0,L,0,height]];
  for(const g of (w.gaps||[])){
    const gw=g.type==='door'?0.9:1.2, o0=Math.max(0,g.pos-gw/2), o1=Math.min(L,g.pos+gw/2);
    const gY0=g.type==='door'?0:0.9, gY1=g.type==='door'?2.07:2.31;
    const next=[];
    for(const r of solid){
      const a=r[0],b=r[1],c=r[2],d=r[3];
      if(a<o0) next.push([a,Math.min(o0,b),c,d]);
      if(b>o1) next.push([Math.max(o1,a),b,c,d]);
      if(a<o1&&b>o0){ if(c<gY0) next.push([Math.max(a,o0),Math.min(b,o1),c,gY0]);
        if(d>gY1) next.push([Math.max(a,o0),Math.min(b,o1),gY1,d]); }
    }
    solid=next;
  }
  const res=[];
  for(const r of solid){
    const a=r[0],b=r[1],c=r[2],d=r[3];
    res.push({ ox:w.x1, oz:w.z1, ux, uz, a0:a, a1:b, y0:base+c, y1:base+d, t });
  }
  return res;
}
// неправильный повёрнутый вдоль направления стены параллелепипед (верная толщина и на диагонали)
function meshFromWallBox(b,m){
  const g=new THREE.BoxGeometry(b.a1-b.a0, b.y1-b.y0, b.t);
  const mesh=new THREE.Mesh(g,m);
  const along=(b.a0+b.a1)/2;
  mesh.position.set(b.ox+b.ux*along, (b.y0+b.y1)/2, b.oz+b.uz*along);
  const m3=new THREE.Matrix4().makeBasis(
    new THREE.Vector3(b.ux,0,b.uz),
    new THREE.Vector3(0,1,0),
    new THREE.Vector3(-b.uz,0,b.ux));
  mesh.quaternion.setFromRotationMatrix(m3);
  mesh.castShadow=mesh.receiveShadow=true; return mesh;
}
function floorBounds(fl){
  let r={minX:1e9,maxX:-1e9,minZ:1e9,maxZ:-1e9,any:false};
  for(const w of fl.walls){ r.any=true;
    r.minX=Math.min(r.minX,w.x1,w.x2); r.maxX=Math.max(r.maxX,w.x1,w.x2);
    r.minZ=Math.min(r.minZ,w.z1,w.z2); r.maxZ=Math.max(r.maxZ,w.z1,w.z2); }
  return r.any?r:null;
}
function floorSlab(b,y){
  const m=new THREE.Mesh(new THREE.BoxGeometry(b.maxX-b.minX+0.12,0.10,b.maxZ-b.minZ+0.12),matSlab);
  m.position.set((b.minX+b.maxX)/2,y,(b.minZ+b.maxZ)/2); m.receiveShadow=true; return m;
}

/* ---------- сборка 3D ---------- */
function rebuild3(){
  if(!scene) return;
  while(g3.children.length) g3.remove(g3.children[0]);
  buildMats();
  const floors=PROJ.floors;
  for(let fi=0; fi<floors.length; fi++){
    const fl=floors[fi];
    for(const w of fl.walls)
      for(const b of wallBoxes(w, fl.yBase, fl.height))
        g3.add(meshFromWallBox(b, w.type==='partition'?matPart:matWall));
    // перекрытие между этажами (автоматически)
    if(fi>0){ const bnd=floorBounds(floors[fi-1]); if(bnd) g3.add(floorSlab(bnd, fl.yBase)); }
  }
  const top=floors[floors.length-1];
  if(PROJ.showRoof){
    for(const m of buildRoofs(top)) g3.add(m);
  }
}

/* ---------- крыши ---------- */
function makeGeo(verts,faces){
  const pos=new Float32Array(verts.length*3); let o=0;
  for(const v of verts){ pos[o++]=v[0]; pos[o++]=v[1]; pos[o++]=v[2]; }
  const idx=[]; for(const f of faces) for(let k=0;k<f.length-2;k++) idx.push(f[0],f[k+1],f[k+2]);
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}

function gableGeo(W,D,ry){
  const a=[-W/2,0,-D/2],b=[W/2,0,-D/2],c=[W/2,0,D/2],d2=[-W/2,0,D/2];
  const e=[-W/2,ry,0],f=[W/2,ry,0];
  const V=[a,b,c,d2,e,f];
  return makeGeo(V,[ [0,1,5,4],[3,2,5,4],[0,4,3],[1,5,2] ]);
}
function frustumGeo(W,D,ry){
  const k=0.35;
  const A=[-W/2,0,-D/2],B=[W/2,0,-D/2],C=[W/2,0,D/2],D2=[-W/2,0,D/2];
  const At=[-W/2*k,ry,-D/2*k],Bt=[W/2*k,ry,-D/2*k],Ct=[W/2*k,ry,D/2*k],Dt=[-W/2*k,ry,D/2*k];
  return makeGeo([A,B,C,D2,At,Bt,Ct,Dt],[0,1,5,4,1,2,6,5,2,3,7,6,3,0,4,7,4,5,6,7]);
}
function shedGeo(W,D,ry){
  const a=[-W/2,0,-D/2],b=[W/2,0,-D/2],c=[W/2,ry,D/2],d=[-W/2,ry,D/2];
  return makeGeo([a,b,c,d],[0,1,2,3]);
}
function frustumRoof(W,D,h,scale){ const k=scale;
  const a=[-W/2,0,-D/2],b=[W/2,0,-D/2],c=[W/2,0,D/2],d2=[-W/2,0,D/2];
  const e=[-W/2*k,h,-D/2*k],f=[W/2*k,h,-D/2*k],g=[W/2*k,h,D/2*k],e2=[-W/2*k,h,D/2*k];
  return makeGeo([a,b,c,d2,e,f,g,e2],[0,1,5,4,1,2,6,5,2,3,7,6,3,0,4,7,4,5,6,7]);
}

// Каркас крыши для КОНТУРА стен: главная ось (PCA по направлениям) + пролёты по осям.
function roofFrame(walls){
  const ws=walls.filter(w=>w.type==='wall');
  const wl=ws.length?ws:walls;
  let Sxx=0,Szz=0,Sxy=0,T=0, longest=null, lmax=-1;
  for(const w of wl){
    const dx=w.x2-w.x1,dz=w.z2-w.z1,len=Math.hypot(dx,dz); if(len<1e-6)continue;
    if(len>lmax){lmax=len;longest=w;}
    const nx=dx/len,nz=dz/len;
    Sxx+=len*nx*nx; Szz+=len*nz*nz; Sxy+=len*nx*nz; T+=len;
  }
  if(!T) return null;
  let theta;
  // вырожденный/квадратный случай (нет преимущего направления) — берём самую длинную стену
  if((Sxx-Szz)*(Sxx-Szz)+4*Sxy*Sxy < T*T*1e-5 && longest){
    theta=Math.atan2(longest.z2-longest.z1, longest.x2-longest.x1);
  } else {
    theta=0.5*Math.atan2(2*Sxy, Sxx-Szz);
  }
  const ux=Math.cos(theta), uz=Math.sin(theta), px=-uz, pz=ux;
  let minA=1e9,maxA=-1e9,minB=1e9,maxB=-1e9,ex=0,ez=0,n=0;
  for(const w of wl){
    for(const [x,z] of [[w.x1,w.z1],[w.x2,w.z2]]){
      const a=x*ux+z*uz, b=x*px+z*pz;
      if(a<minA)minA=a; if(a>maxA)maxA=a;
      if(b<minB)minB=b; if(b>maxB)maxB=b;
      ex+=x; ez+=z; n++;
    }
  }
return { ux,uz,px,pz, theta,
    ridge:maxA-minA, run:maxB-minB,
    cx:ex/n, cz:ez/n };
}

// Разделение ВНЕШНИХ стен на замкнутые контуры (связные компоненты, содержащие цикл).
function closedContours(allWalls){
  const ws=allWalls.filter(w=>w.type==='wall');
  const key=(x,z)=>{ const t=0.05; return (Math.round(x/t)*t)+','+(Math.round(z/t)*t); };
  const adj=new Map();
  const addKey=(k,i)=>{ if(!adj.has(k))adj.set(k,[]); adj.get(k).push(i); };
  for(let i=0;i<ws.length;i++){ const w=ws[i]; addKey(key(w.x1,w.z1),i); addKey(key(w.x2,w.z2),i); }
  const used=new Array(ws.length).fill(false), out=[];
  for(let i=0;i<ws.length;i++){
    if(used[i]) continue;
    const stk=[i], comp=[], verts=new Set();
    used[i]=true;
    while(stk.length){
      const j=stk.pop(); comp.push(j); const w=ws[j];
      verts.add(key(w.x1,w.z1)); verts.add(key(w.x2,w.z2));
      for(const k of [key(w.x1,w.z1),key(w.x2,w.z2)])
        for(const m of (adj.get(k)||[])) if(!used[m]){ used[m]=true; stk.push(m); }
    }
    // контур замкнут, если в компоненте есть цикл: у связного компонента рёбер >= вершин
    if(comp.length>=3 && verts.size<=comp.length) out.push(comp.map(i=>ws[i]));
  }
  return out;
}

function contourBounds(c){
  let r={minX:1e9,maxX:-1e9,minZ:1e9,maxZ:-1e9,any:false};
  for(const w of c){ r.any=true;
    r.minX=Math.min(r.minX,w.x1,w.x2); r.maxX=Math.max(r.maxX,w.x1,w.x2);
    r.minZ=Math.min(r.minZ,w.z1,w.z2); r.maxZ=Math.max(r.maxZ,w.z1,w.z2); }
  return r;
}

// Крыша для каждого замкнутого контура: самый большой контур — основная крыша,
// остальные (примыкающие пристройки) — крыша аннеска. У каждой свои 4 типа и уклон/свес.
function buildRoofs(top){
  const out=[];
  const contours=closedContours(top.walls);
  if(!contours.length) return out;
  const baseY=top.yBase+top.height;
  const bounds=contours.map(contourBounds);
  let mainIdx=-1, bestArea=-1;
  bounds.forEach((b,i)=>{ const a=(b.maxX-b.minX)*(b.maxZ-b.minZ); if(a>bestArea){bestArea=a;mainIdx=i;} });
  for(let i=0;i<contours.length;i++){
    const b=bounds[i], cfg=(i===mainIdx)?PROJ.roof:PROJ.roofAnnex;
    const fr=roofFrame(contours[i]); if(!fr) continue;
    const ridge=fr.ridge+2*cfg.over, run=fr.run+2*cfg.over, sl=cfg.slope*Math.PI/180;
    let geo;
    if(cfg.type==='gable') geo=gableGeo(ridge, run, Math.tan(sl)*run/2);
    else if(cfg.type==='shed') geo=shedGeo(ridge, run, Math.tan(sl)*run);
    else if(cfg.type==='flat') geo=frustumRoof(ridge, run, 0.3, 1);
    else geo=frustumRoof(ridge, run, Math.tan(sl)*run/2, 0.5);
    const m=new THREE.Mesh(geo,matRoof);
    m.position.set(fr.cx, baseY, fr.cz);
    m.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(
      new THREE.Vector3(fr.ux,0,fr.uz), new THREE.Vector3(0,1,0), new THREE.Vector3(fr.px,0,fr.pz)));
    m.castShadow=m.receiveShadow=true;
    out.push(m);
    if(cfg.type==='flat' && b.any) out.push(floorSlab(b, baseY));
  }
  return out;
}

============================================================ */
refreshTabs(); refreshHeightInput(); refreshMats();
setTool('draw');
refresh();
size2();
init3D();

/* перетаскивание разделителя */
(function(){
  const rz=document.getElementById('resize'), lf=document.getElementById('left2d');
  let dragging=false;
  rz.addEventListener('mousedown', e=>{ dragging=true; e.preventDefault(); });
  window.addEventListener('mousemove', e=>{ if(!dragging)return;
    const w=Math.min(window.innerWidth-260, Math.max(260, e.clientX));
    lf.style.flexBasis=Math.round(w*100/ window.innerWidth)+'%';
    size2(); draw2(); resize3();
  });
  window.addEventListener('mouseup', ()=>dragging=false);
})();
